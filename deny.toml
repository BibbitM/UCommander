# cargo-deny configuration. Run: cargo deny check
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
# Fail on crates with security advisories, and on unmaintained or yanked crates.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Licenses that are compatible with "MIT OR Apache-2.0" distribution.
# A new license needs owner approval (see AGENTS.md, gates).
allow = [
    "MIT",
    "Apache-2.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates use path dependencies without a version.
allow-wildcard-paths = true

[sources]
# Only crates.io. A git dependency needs owner approval.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
